# Deploy the full pitch-doctor web UI (FastAPI + Playwright) on Render.
# Dashboard: New → Blueprint → connect this repo, or:
#   https://dashboard.render.com/select-repo?type=blueprint
#
# Plan: starter (not free) so the container stays warm and scans finish
# within the uvicorn timeout.  The free plan sleeps after ~15 min and
# the cold-start often hits that 25s limit.
#
# Custom domain (e.g. test.mariosalvarez.com) is free on Render.

services:
  - type: web
    name: pitch-doctor
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PLAYWRIGHT_CHANNEL
        value: chromium
      - key: PLAYWRIGHT_NO_SANDBOX
        value: "1"
      - key: PITCH_DOCTOR_RENDER_TIMEOUT
        value: "25"
      - key: PITCH_DOCTOR_SIGN_SALT
        value: "zerodigitx-2026"
